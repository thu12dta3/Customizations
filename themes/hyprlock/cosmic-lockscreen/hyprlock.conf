# Cosmic Login for hyprlock 0.9.x. Experimental until PAM/compositor testing.
# Paths are expanded by the installer; password authentication remains native.
general {
    hide_cursor = true
}
background {
    monitor =
    path = __ASSET_DIR__/cosmic-timetraveler-LhDWW8PhPoE-unsplash.jpg
    blur_passes = 0
    brightness = 0.75
}
shape {
    monitor =
    size = 400, 245
    color = rgba(181825c2)
    rounding = 18
    border_size = 1
    border_color = rgba(cdd6f421)
    position = 9%, -45
    halign = left
    valign = center
    zindex = 1
}
label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 70
    font_family = JetBrains Mono
    position = 9%, 170
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    color = rgba(cdd6f4c2)
    font_size = 13
    font_family = Noto Sans
    position = 9%, 112
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = Entrar
    color = rgba(cdd6f4ff)
    font_size = 16
    position = 10%, 45
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = $USER
    color = rgba(cdd6f4ff)
    font_size = 14
    position = 10%, 5
    halign = left
    valign = center
    zindex = 2
}
input-field {
    monitor =
    size = 352, 45
    outline_thickness = 1
    dots_size = 0.25
    dots_center = false
    outer_color = rgba(cba6f7bf)
    inner_color = rgba(313244a3)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(cba6f7ff)
    fail_color = rgba(f38ba8ff)
    placeholder_text = Senha
    fail_text = Senha incorreta. Tente novamente.
    rounding = 9
    position = 10%, -70
    halign = left
    valign = center
    zindex = 2
}
